name: Lint

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-and-yaml:
    name: Lint Python and YAML
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/requirements.txt
            app/gateway-service/requirements.txt
            app/users-service/requirements.txt
            app/orders-service/requirements.txt

      - name: Install linters
        run: python -m pip install ruff==0.12.10 yamllint==1.37.1

      - name: Lint Python
        run: ruff check app tests analysis experiments/lib

      - name: Check Bash syntax
        shell: bash
        run: |
          find scripts experiments -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Lint static YAML
        shell: bash
        run: |
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
            ! -path './.git/*' \
            ! -path './helm/*/templates/*' -print0 \
            | xargs -0 -r yamllint \
                -d '{extends: default, rules: {document-start: disable, line-length: disable, truthy: {check-keys: false}}}'

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint chart
        run: helm lint ./helm/microservices-app

      - name: Render chart
        run: >-
          helm template microservices-app ./helm/microservices-app
          --namespace test-render
          > /tmp/microservices-app.yaml
